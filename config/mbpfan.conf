# /etc/mbpfan.conf for MacBookPro7,1. The SMC fan curve reacts late; this keeps the CPU cooler.
[general]
min_fan1_speed = 2000   # SMC minimum (fan1_min)
max_fan1_speed = 6200   # SMC maximum (fan1_max)
low_temp = 60           # below: fan at minimum (typical idle 55-62 °C)
high_temp = 66          # above: fan ramps up
max_temp = 82           # above: fan at maximum
polling_interval = 1
