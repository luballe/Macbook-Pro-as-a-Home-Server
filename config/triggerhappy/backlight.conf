# /etc/triggerhappy/triggers.d/backlight.conf
# Brightness keys (F1/F2 on the built-in keyboard, also on external keyboards).
# 1 = key press, 2 = key held down.
KEY_BRIGHTNESSDOWN 1 /usr/local/sbin/backlight down
KEY_BRIGHTNESSDOWN 2 /usr/local/sbin/backlight down
KEY_BRIGHTNESSUP   1 /usr/local/sbin/backlight up
KEY_BRIGHTNESSUP   2 /usr/local/sbin/backlight up
